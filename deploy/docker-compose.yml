# ARCHITECTURE.md > Deployment > Compose services.
# Run from the repo root: docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# --env-file is required so ${POSTGRES_PASSWORD} etc. resolve for variable
# substitution below (env_file: only injects vars into the containers).

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Override the host-facing defaults from .env with in-network addresses.
      DATABASE_URL: postgresql+psycopg://careerpath:${POSTGRES_PASSWORD}@db:5432/careerpath
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: careerpath
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpath"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" -- internal network only, reachable from "app" alone
    # (ARCHITECTURE.md > Topology; checked at G2).

volumes:
  db_data:
  caddy_data:
  caddy_config:
